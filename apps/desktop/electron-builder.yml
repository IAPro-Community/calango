# Pacote interno de testes do desktop (issue #116). Não é distribuição pública:
# o instalador não é assinado e não tem atualização automática (ver #39).
appId: io.github.iapro-community.calango
productName: Calango
copyright: Copyright © Calango contributors
directories:
  output: release
  buildResources: build
files:
  - dist/main/**
  - dist/preload/**
  - dist/shared/**
  - dist/renderer/**
  - package.json
extraResources:
  - from: ../../LICENSE
    to: legal/LICENSE
  - from: ../../NOTICE
    to: legal/NOTICE
  - from: ../../third_party
    to: legal/third_party
asar: true
npmRebuild: false
win:
  extraResources:
    - from: ../../bin/calango.exe
      to: bin/calango.exe
  target:
    - target: nsis
      arch: [x64]
  icon: ../../site/assets/logo-512.png
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  license: ../../LICENSE
  artifactName: Calango-${version}-interno-nao-assinado-${arch}.${ext}
publish: null
