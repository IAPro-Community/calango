# CI do Calango. Os checks não corrigem arquivos automaticamente.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@2.81.0 lint --extends minimal api/openapi.yaml --max-problems=0

  generated-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Check generated design tokens
        run: node scripts/generate-tokens.mjs --check
      - name: Check generated translations
        run: node scripts/generate-i18n.mjs --check
      - name: Test generated asset contracts
        run: node --test scripts/generate-assets.test.mjs

  dart-packages:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      FLUTTER_VERSION: "3.47.9"
      FLUTTER_SHA256: "25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - run: npm ci
      - name: Check generated Dart SDK and Flutter tokens
        run: |
          node scripts/generate-sdk-dart.mjs --check
          node scripts/generate-tokens.mjs --check
      - name: Install Flutter from the official archive
        run: |
          archive="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$archive"
          echo "$FLUTTER_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version --suppress-analytics
      - name: Dart SDK (format, analyze, test)
        working-directory: packages/sdk-dart
        run: |
          dart pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart test
      - name: Flutter theme (format, analyze, test)
        working-directory: packages/theme-flutter
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed .
          flutter analyze --fatal-infos
          flutter test

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - run: go test ./... -count=1
      - run: go test -race ./... -count=1 -timeout 5m
      - run: test -z "$(gofmt -l cmd internal)"

  cross-build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build calango
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o "${{ runner.temp }}/calango" ./cmd/calango

  site-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site image
        run: docker build -t calango-site:ci .
      - name: Start the container and check /healthz
        run: |
          docker run -d --name site -p 8080:8080 calango-site:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz && exit 0
            sleep 1
          done
          docker logs site
          exit 1

  node-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the node image
        run: docker build -f deploy/Dockerfile.node -t calango/calango:ci .
      - name: Verify license files in node image
        run: |
          cid=$(docker create calango/calango:ci)
          trap 'docker rm "$cid" >/dev/null' EXIT
          docker cp "$cid:/usr/share/licenses/calango/third_party/iapro-sdk/LICENSE" "$RUNNER_TEMP/iapro-sdk-license"
          docker cp "$cid:/usr/share/licenses/calango/third_party/iapro-sdk/NOTICE" "$RUNNER_TEMP/iapro-sdk-notice"
          cmp third_party/iapro-sdk/LICENSE "$RUNNER_TEMP/iapro-sdk-license"
          cmp third_party/iapro-sdk/NOTICE "$RUNNER_TEMP/iapro-sdk-notice"

  # Pacotes Linux do desktop (#40): gera .deb e AppImage, confere LICENSE/NOTICE/third_party no
  # pacote e valida instalação, atualização, daemon instalado e remoção em contêineres limpos.
  # Não publica nada: nenhum artefato é enviado.
  desktop-linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - run: npm ci
      - run: npm run desktop:package:linux
      - run: sha256sum apps/desktop/release/Calango-*-linux-*
      - run: npm run desktop:package:linux:test
  # Build nativo da imagem arm64 (sem push) e execução do binário com /healthz.
  node-image-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build the node image (linux/arm64)
        run: docker build -f deploy/Dockerfile.node -t calango/calango:ci-arm64 .
      - name: Start the container and check /healthz
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' calango/calango:ci-arm64)" = arm64
          umask 077
          key="$RUNNER_TEMP/vault.key"
          head -c 32 /dev/urandom | base64 > "$key"
          sudo chown 65532:65532 "$key"
          docker run -d --name node -e CALANGO_DATA_DIR=/tmp/calango \
            -e CALANGO_VAULT_KEY_FILE=/run/secrets/vault_key \
            -v "$key:/run/secrets/vault_key:ro" calango/calango:ci-arm64
          for _ in $(seq 1 30); do
            docker exec node /usr/local/bin/calango healthcheck && exit 0
            sleep 1
          done
          docker logs node
          exit 1

  # Variante maestro da imagem (alvo maestro do Dockerfile.node, Node.js + npm), sem push, nas
  # duas arquiteturas em runner nativo: Node >= 20.19, uid 65532, licenças, /healthz e a
  # instalação automática do Maestro pelo registro npm real. No amd64 roda também o teste de
  # ponta a ponta com o instalador (deploy/test/maestro-vps-e2e.sh): opt-out, atualização,
  # verify, rollback e versão que falha no verify.
  node-image-maestro:
    name: node-image-maestro (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build the node image (maestro, linux/${{ matrix.arch }})
        run: docker build -f deploy/Dockerfile.node --target maestro -t calango/calango:ci-maestro .
      - name: Node.js, usuário e licenças
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' calango/calango:ci-maestro)" = "${{ matrix.arch }}"
          test "$(docker image inspect --format '{{.Config.User}}' calango/calango:ci-maestro)" = 65532:65532
          docker run --rm --entrypoint node calango/calango:ci-maestro -e '
            const [a, b] = process.versions.node.split(".").map(Number);
            if (a < 20 || (a === 20 && b < 19)) { console.error("Node " + process.version + " < 20.19"); process.exit(1); }
            console.log("Node " + process.version);'
          docker run --rm --entrypoint npm calango/calango:ci-maestro --version
          cid=$(docker create calango/calango:ci-maestro)
          docker cp "$cid:/usr/share/licenses/calango/third_party/iapro-sdk/LICENSE" "$RUNNER_TEMP/iapro-sdk-license"
          docker rm "$cid" >/dev/null
          cmp third_party/iapro-sdk/LICENSE "$RUNNER_TEMP/iapro-sdk-license"
      - name: /healthz e instalação automática do Maestro
        run: |
          umask 077
          key="$RUNNER_TEMP/vault.key"
          head -c 32 /dev/urandom | base64 > "$key"
          sudo chown 65532:65532 "$key"
          docker run -d --name node -e CALANGO_DATA_DIR=/data \
            -e CALANGO_VAULT_KEY_FILE=/run/secrets/vault_key \
            -v "$key:/run/secrets/vault_key:ro" calango/calango:ci-maestro
          ok=""
          for _ in $(seq 1 30); do
            docker exec node /usr/local/bin/calango healthcheck && ok=1 && break
            sleep 1
          done
          test -n "$ok" || { docker logs node; exit 1; }
          for _ in $(seq 1 100); do
            if docker exec node test -s /data/maestro/current; then
              echo "Maestro $(docker exec node cat /data/maestro/current) instalado"
              if docker logs node 2>&1 | grep 'maestro automatic update failed'; then exit 1; fi
              exit 0
            fi
            sleep 3
          done
          docker logs node
          exit 1
      - name: Teste de ponta a ponta com o instalador
        if: matrix.arch == 'amd64'
        run: sh deploy/test/maestro-vps-e2e.sh calango/calango:ci-maestro

  # Instalador da VPS: lint, compose/Caddyfile iguais aos gerados e instalação limpa de ponta
  # a ponta (CA interna do Caddy, imagem local), reinstalação e remoção preservando dados.
  vps-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -s sh deploy/install.sh deploy/test/maestro-vps-e2e.sh
      - name: Compose e Caddyfile versionados batem com o instalador
        run: |
          sh deploy/install.sh --print-compose | diff -u deploy/docker-compose.yml -
          sh deploy/install.sh --print-caddyfile | diff -u deploy/Caddyfile -
      - name: Build the node image
        run: docker build -f deploy/Dockerfile.node -t calango/calango:ci .
      - name: Instalação limpa
        run: sudo sh deploy/install.sh --domain calango.test --image calango/calango:ci --no-pull --tls-internal
      - name: Healthz pelo proxy, token e idempotência
        run: |
          c="sudo docker compose -f /opt/calango/docker-compose.yml"
          curl -fsS -k --resolve calango.test:443:127.0.0.1 https://calango.test/healthz
          if curl -fsS --max-time 3 http://127.0.0.1:7317/healthz; then
            echo "::error::a porta do nó não deveria estar publicada"; exit 1
          fi
          key1=$(sudo sha256sum /opt/calango/secrets/vault.key)
          tok1=$($c exec -T calango calango print-token | sha256sum)
          code=$(curl -s -k -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $($c exec -T calango calango print-token)" \
            --resolve calango.test:443:127.0.0.1 https://calango.test/v1/devices)
          test "$code" = 200
          sudo sh deploy/install.sh --domain calango.test --image calango/calango:ci --no-pull --tls-internal
          test "$key1" = "$(sudo sha256sum /opt/calango/secrets/vault.key)"
          test "$tok1" = "$($c exec -T calango calango print-token | sha256sum)"
          sudo sh deploy/install.sh --uninstall
          docker volume inspect calango_calango-data >/dev/null
          sudo sh deploy/install.sh --image calango/calango:ci --no-pull
          test "$tok1" = "$($c exec -T calango calango print-token | sha256sum)"
          curl -fsS -k --resolve calango.test:443:127.0.0.1 https://calango.test/healthz
      - name: Logs em caso de falha
        if: failure()
        run: sudo docker compose -f /opt/calango/docker-compose.yml logs --no-color || true
      - name: Remoção completa
        if: always()
        run: sudo sh deploy/install.sh --uninstall --purge --yes || true

  source-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - run: npm run format:web:check
      - run: npm run lint:web
        if: ${{ !cancelled() }}

  desktop:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - run: npm ci
      - run: npm run contracts:check
      - name: Check third-party license texts and NOTICE
        run: npm run licenses:check
      - run: npm run typecheck
      - run: npm run test:main -w apps/desktop
      - run: npm run test:renderer -w apps/desktop
      - run: npm run desktop:build

  # E2E do desktop com daemon real e provider fake (issue #119). Ainda fora do
  # quality-gate até a revisão decidir se vira check obrigatório.
  desktop-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
      - name: Run Playwright Electron E2E
        run: xvfb-run -a npm run desktop:e2e
      - name: Upload traces and screenshots of failures
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-falhas
          path: |
            apps/desktop/e2e-results/
            apps/desktop/e2e-report/
          retention-days: 7

  # Instalador interno não assinado (#116). Instala em silêncio no runner descartável,
  # sobe o daemon instalado, confere /healthz e que o log não contém o token, e desinstala.
  desktop-windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - run: npm ci
      - run: npm run desktop:package:win
      - name: Gerar checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/release -Filter 'Calango-*-interno-nao-assinado-x64.exe' | Select-Object -First 1
          if (-not $exe) { throw 'instalador não encontrado' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "$($exe.FullName).sha256"
          "INSTALLER=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-Content "$($exe.FullName).sha256"
      - name: Instalar, subir o daemon instalado e desinstalar
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Calango'
          Start-Process -Wait -FilePath $env:INSTALLER -ArgumentList '/S', "/D=$dir"
          $daemon = Join-Path $dir 'resources\bin\calango.exe'
          foreach ($f in 'Calango.exe', 'resources\bin\calango.exe', 'resources\legal\LICENSE', 'resources\legal\NOTICE', 'resources\legal\third_party\iapro-sdk\LICENSE', 'resources\legal\third_party\agenticos\LICENSE') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "faltando no pacote instalado: $f" }
          }
          # Chave de teste descartável: o keyring do Windows fica fora deste smoke (#55).
          $bytes = [byte[]]::new(32); [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $env:CALANGO_VAULT_KEY = [Convert]::ToBase64String($bytes)
          $env:CALANGO_DATA_DIR = Join-Path $env:RUNNER_TEMP 'calango-data'
          $env:CALANGO_ADDR = '127.0.0.1:7317'
          $out = Join-Path $env:RUNNER_TEMP 'daemon.out'; $err = Join-Path $env:RUNNER_TEMP 'daemon.err'
          $proc = Start-Process -PassThru -NoNewWindow -FilePath $daemon -RedirectStandardOutput $out -RedirectStandardError $err
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            try { $ok = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7317/healthz).StatusCode -eq 200 } catch { Start-Sleep 1 }
          }
          $token = (& $daemon print-token).Trim()
          Write-Output "::add-mask::$token"
          Stop-Process -Id $proc.Id -Force
          Get-Content $out, $err
          if (-not $ok) { throw 'daemon instalado não respondeu /healthz' }
          if ((Get-Content -Raw $out, $err) -match [regex]::Escape($token)) { throw 'log do daemon contém o token' }
          Start-Process -Wait -FilePath (Join-Path $dir 'Uninstall Calango.exe') -ArgumentList '/S'
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir 'Calango.exe')); $i++) { Start-Sleep 1 }
          if (Test-Path (Join-Path $dir 'Calango.exe')) { throw 'desinstalação não removeu o aplicativo' }
      - uses: actions/upload-artifact@v4
        with:
          name: calango-windows-interno-nao-assinado
          path: |
            apps/desktop/release/Calango-*-interno-nao-assinado-x64.exe
            apps/desktop/release/Calango-*-interno-nao-assinado-x64.exe.sha256
            DEV/INSTALADOR_WINDOWS_INTERNO.md
          retention-days: 14
          if-no-files-found: error

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs: [openapi, generated-contracts, dart-packages, go, cross-build, site-image, node-image, node-image-arm64, node-image-maestro, vps-installer, source-quality, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir sucesso de todos os checks
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'
