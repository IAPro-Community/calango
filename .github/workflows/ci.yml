# CI do Calango. Os checks não corrigem arquivos automaticamente.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@2.81.0 lint --extends minimal api/openapi.yaml --max-problems=0

  generated-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Check generated design tokens
        run: node scripts/generate-tokens.mjs --check
      - name: Check generated translations
        run: node scripts/generate-i18n.mjs --check
      - name: Test generated asset contracts
        run: node --test scripts/generate-assets.test.mjs

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2024.1.1 ./...
      - run: go test ./... -count=1
      - run: go test -race ./... -count=1 -timeout 5m
      - run: test -z "$(gofmt -l cmd internal)"

  cross-build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build calango
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o "${{ runner.temp }}/calango" ./cmd/calango

  site-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site image
        run: docker build -t calango-site:ci .
      - name: Start the container and check /healthz
        run: |
          docker run -d --name site -p 8080:8080 calango-site:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz && exit 0
            sleep 1
          done
          docker logs site
          exit 1

  node-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the node image
        run: docker build -f deploy/Dockerfile.node -t calango/calango:ci .
      - name: Verify license files in node image
        run: |
          cid=$(docker create calango/calango:ci)
          trap 'docker rm "$cid" >/dev/null' EXIT
          docker cp "$cid:/usr/share/licenses/calango/third_party/iapro-sdk/LICENSE" "$RUNNER_TEMP/iapro-sdk-license"
          docker cp "$cid:/usr/share/licenses/calango/third_party/iapro-sdk/NOTICE" "$RUNNER_TEMP/iapro-sdk-notice"
          cmp third_party/iapro-sdk/LICENSE "$RUNNER_TEMP/iapro-sdk-license"
          cmp third_party/iapro-sdk/NOTICE "$RUNNER_TEMP/iapro-sdk-notice"

  # Build nativo da imagem arm64 (sem push) e execução do binário com /healthz.
  node-image-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build the node image (linux/arm64)
        run: docker build -f deploy/Dockerfile.node -t calango/calango:ci-arm64 .
      - name: Start the container and check /healthz
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' calango/calango:ci-arm64)" = arm64
          umask 077
          key="$RUNNER_TEMP/vault.key"
          head -c 32 /dev/urandom | base64 > "$key"
          sudo chown 65532:65532 "$key"
          docker run -d --name node -e CALANGO_DATA_DIR=/tmp/calango \
            -e CALANGO_VAULT_KEY_FILE=/run/secrets/vault_key \
            -v "$key:/run/secrets/vault_key:ro" calango/calango:ci-arm64
          for _ in $(seq 1 30); do
            docker exec node /usr/local/bin/calango healthcheck && exit 0
            sleep 1
          done
          docker logs node
          exit 1

  # Variante maestro da imagem (alvo maestro do Dockerfile.node, Node.js + npm), sem push, nas
  # duas arquiteturas em runner nativo: Node >= 20.19, uid 65532, licenças, /healthz e a
  # instalação automática do Maestro pelo registro npm real. No amd64 roda também o teste de
  # ponta a ponta com o instalador (deploy/test/maestro-vps-e2e.sh): opt-out, atualização,
  # verify, rollback e versão que falha no verify.
  node-image-maestro:
    name: node-image-maestro (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build the node image (maestro, linux/${{ matrix.arch }})
        run: docker build -f deploy/Dockerfile.node --target maestro -t calango/calango:ci-maestro .
      - name: Node.js, usuário e licenças
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' calango/calango:ci-maestro)" = "${{ matrix.arch }}"
          test "$(docker image inspect --format '{{.Config.User}}' calango/calango:ci-maestro)" = 65532:65532
          docker run --rm --entrypoint node calango/calango:ci-maestro -e '
            const [a, b] = process.versions.node.split(".").map(Number);
            if (a < 20 || (a === 20 && b < 19)) { console.error("Node " + process.version + " < 20.19"); process.exit(1); }
            console.log("Node " + process.version);'
          docker run --rm --entrypoint npm calango/calango:ci-maestro --version
          cid=$(docker create calango/calango:ci-maestro)
          docker cp "$cid:/usr/share/licenses/calango/third_party/iapro-sdk/LICENSE" "$RUNNER_TEMP/iapro-sdk-license"
          docker rm "$cid" >/dev/null
          cmp third_party/iapro-sdk/LICENSE "$RUNNER_TEMP/iapro-sdk-license"
      - name: /healthz e instalação automática do Maestro
        run: |
          umask 077
          key="$RUNNER_TEMP/vault.key"
          head -c 32 /dev/urandom | base64 > "$key"
          sudo chown 65532:65532 "$key"
          docker run -d --name node -e CALANGO_DATA_DIR=/data \
            -e CALANGO_VAULT_KEY_FILE=/run/secrets/vault_key \
            -v "$key:/run/secrets/vault_key:ro" calango/calango:ci-maestro
          ok=""
          for _ in $(seq 1 30); do
            docker exec node /usr/local/bin/calango healthcheck && ok=1 && break
            sleep 1
          done
          test -n "$ok" || { docker logs node; exit 1; }
          for _ in $(seq 1 100); do
            if docker exec node test -s /data/maestro/current; then
              echo "Maestro $(docker exec node cat /data/maestro/current) instalado"
              if docker logs node 2>&1 | grep 'maestro automatic update failed'; then exit 1; fi
              exit 0
            fi
            sleep 3
          done
          docker logs node
          exit 1
      - name: Teste de ponta a ponta com o instalador
        if: matrix.arch == 'amd64'
        run: sh deploy/test/maestro-vps-e2e.sh calango/calango:ci-maestro

  # Instalador da VPS: lint, compose/Caddyfile iguais aos gerados e instalação limpa de ponta
  # a ponta (CA interna do Caddy, imagem local), reinstalação e remoção preservando dados.
  vps-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -s sh deploy/install.sh deploy/test/maestro-vps-e2e.sh
      - name: Compose e Caddyfile versionados batem com o instalador
        run: |
          sh deploy/install.sh --print-compose | diff -u deploy/docker-compose.yml -
          sh deploy/install.sh --print-caddyfile | diff -u deploy/Caddyfile -
      - name: Build the node image
        run: docker build -f deploy/Dockerfile.node -t calango/calango:ci .
      - name: Instalação limpa
        run: sudo sh deploy/install.sh --domain calango.test --image calango/calango:ci --no-pull --tls-internal
      - name: Healthz pelo proxy, token e idempotência
        run: |
          c="sudo docker compose -f /opt/calango/docker-compose.yml"
          curl -fsS -k --resolve calango.test:443:127.0.0.1 https://calango.test/healthz
          if curl -fsS --max-time 3 http://127.0.0.1:7317/healthz; then
            echo "::error::a porta do nó não deveria estar publicada"; exit 1
          fi
          key1=$(sudo sha256sum /opt/calango/secrets/vault.key)
          tok1=$($c exec -T calango calango print-token | sha256sum)
          code=$(curl -s -k -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $($c exec -T calango calango print-token)" \
            --resolve calango.test:443:127.0.0.1 https://calango.test/v1/devices)
          test "$code" = 200
          sudo sh deploy/install.sh --domain calango.test --image calango/calango:ci --no-pull --tls-internal
          test "$key1" = "$(sudo sha256sum /opt/calango/secrets/vault.key)"
          test "$tok1" = "$($c exec -T calango calango print-token | sha256sum)"
          sudo sh deploy/install.sh --uninstall
          docker volume inspect calango_calango-data >/dev/null
          sudo sh deploy/install.sh --image calango/calango:ci --no-pull
          test "$tok1" = "$($c exec -T calango calango print-token | sha256sum)"
          curl -fsS -k --resolve calango.test:443:127.0.0.1 https://calango.test/healthz
      - name: Logs em caso de falha
        if: failure()
        run: sudo docker compose -f /opt/calango/docker-compose.yml logs --no-color || true
      - name: Remoção completa
        if: always()
        run: sudo sh deploy/install.sh --uninstall --purge --yes || true

  source-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - run: npm run format:web:check
      - run: npm run lint:web
        if: ${{ !cancelled() }}

  desktop:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - run: npm ci
      - run: npm run contracts:check
      - run: npm run typecheck
      - run: npm run test:main -w apps/desktop
      - run: npm run desktop:build

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs: [openapi, generated-contracts, go, cross-build, site-image, node-image, node-image-arm64, node-image-maestro, vps-installer, source-quality, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir sucesso de todos os checks
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'
