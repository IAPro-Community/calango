# CI: require the stable quality-gate only after a real PR run is verified.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@2.81.0 lint --extends minimal api/openapi.yaml --max-problems=0

  generated-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Check generated design tokens
        run: node scripts/generate-tokens.mjs --check
      - name: Check generated translations
        run: node scripts/generate-i18n.mjs --check
      - name: Test generated asset contracts
        run: node --test scripts/generate-assets.test.mjs

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: test -z "$(gofmt -l .)"

  cross-build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build calango
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o "${{ runner.temp }}/calango" ./cmd/calango

  site-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site image
        run: docker build -t calango-site:ci .
      - name: Start the container and check /healthz
        run: |
          docker run -d --name site -p 8080:8080 calango-site:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz && exit 0
            sleep 1
          done
          docker logs site
          exit 1

  node-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the node image
        run: docker build -f deploy/Dockerfile.node -t calango/calango:ci .

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs: [openapi, generated-contracts, go, cross-build, site-image, node-image]
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'
